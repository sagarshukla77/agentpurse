
# AgentPurse - Free Render deployment

databases:
  - name: agentpurse-db
    plan: free
    databaseName: agentpurse
    user: agentpurse

services:
  - type: web
    name: agentpurse
    runtime: node
    plan: free

    buildCommand: npm ci --include=dev && npm run build

    # Run migrations and seed the database before starting Next.js.
    startCommand: npm run db:migrate && npm run db:seed && npm start

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentpurse-db
          property: connectionString

      - key: SESSION_SECRET
        generateValue: true

      - key: APPROVAL_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        sync: false

      - key: INLINE_WORKER
        value: "true"

      - key: DEMO_MODE
        value: "true"

      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"

      - key: NEXT_PUBLIC_DEMO_PASSWORD
        sync: false

      - key: DEMO_PASSWORD
        sync: false

      - key: PAYMENT_HOLD_SECONDS
        value: "20"

      # PayPal Sandbox only. Never use real-money credentials.
      - key: PAYPAL_MODE
        value: "live"

      - key: PAYPAL_BASE_URL
        value: "https://api-m.sandbox.paypal.com"

      - key: PAYPAL_CLIENT_ID
        sync: false

      - key: PAYPAL_CLIENT_SECRET
        sync: false

      - key: PAYPAL_WEBHOOK_ID
        sync: false

      - key: DEMO_VENDOR_EMAIL_NORTHWIND
        sync: false

      - key: DEMO_VENDOR_EMAIL_ACME
        sync: false

      - key: DEMO_VENDOR_EMAIL_LUMEN
        sync: false

      - key: DEMO_VENDOR_EMAIL_PIXEL
        sync: false

      - key: AI_MODE
        value: "gemini"

      - key: GEMINI_API_KEY
        sync: false

      - key: MODEL_EXTRACT
        value: "gemini-flash-latest"

      - key: MODEL_FAST
        value: "gemini-flash-lite-latest"

      - key: MODEL_FALLBACK
        value: "gemini-flash-lite-latest"

      - key: AI_MAX_RPM
        value: "5"

      - key: AI_FALLBACK_MOCK
        value: "true"
